<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年Q3季度勤勉考核</title>
<meta name="description" content="內部主管線上填寫 2026 年 Q3 季度勤勉考核表，各部門評分項目與配分自動計算，即時彙整考核結果。">
<meta property="og:title" content="2026年Q3季度勤勉考核">
<meta property="og:description" content="內部主管線上填寫 2026 年 Q3 季度勤勉考核表，各部門評分項目與配分自動計算，即時彙整考核結果。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

  :root {
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --surface-2: #EBF0F4;
    --text: #1B2430;
    --text-muted: #63707D;
    --border: #D8DEE4;
    --accent: #2E5A7E;
    --accent-strong: #1E3F59;
    --accent-soft: #E4EDF4;
    --good: #2E7D5B;
    --good-soft: #E3F3EA;
    --warn: #A9781F;
    --warn-soft: #FBF1DD;
    --bad: #B4423F;
    --bad-soft: #FAE7E6;
    --shadow: 0 1px 2px rgba(27, 36, 48, 0.05), 0 6px 20px rgba(27, 36, 48, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161B22;
      --surface: #1E2530;
      --surface-2: #242C39;
      --text: #E7EBF0;
      --text-muted: #9AA7B4;
      --border: #323C4A;
      --accent: #79AEDA;
      --accent-strong: #9CC6E9;
      --accent-soft: #24384A;
      --good: #5FBE93;
      --good-soft: #1C3229;
      --warn: #E0AE5C;
      --warn-soft: #362B17;
      --bad: #E58A87;
      --bad-soft: #3A2422;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #161B22;
    --surface: #1E2530;
    --surface-2: #242C39;
    --text: #E7EBF0;
    --text-muted: #9AA7B4;
    --border: #323C4A;
    --accent: #79AEDA;
    --accent-strong: #9CC6E9;
    --accent-soft: #24384A;
    --good: #5FBE93;
    --good-soft: #1C3229;
    --warn: #E0AE5C;
    --warn-soft: #362B17;
    --bad: #E58A87;
    --bad-soft: #3A2422;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-variant-numeric: tabular-nums;
  }

  h1, h2, h3 {
    font-family: "Noto Serif TC", "Noto Sans TC", serif;
    text-wrap: balance;
    margin: 0;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 2px solid var(--accent);
    flex-wrap: wrap;
  }

  header.top .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  header.top h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent-strong);
    letter-spacing: 0.01em;
  }

  header.top .sub {
    font-size: 0.82rem;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  nav.tabs {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    padding: 4px;
    border-radius: 10px;
  }

  nav.tabs button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-weight: 500;
    font-size: 0.88rem;
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  nav.tabs button.active {
    background: var(--surface);
    color: var(--accent-strong);
    box-shadow: var(--shadow);
    font-weight: 700;
  }

  nav.tabs button:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  [hidden] { display: none !important; }

  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--warn-soft);
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.82rem;
    margin-bottom: 18px;
  }

  .banner a { color: inherit; font-weight: 700; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  /* ---------- form view ---------- */

  #view-form .card {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 36px 28px;
  }

  .form-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }

  .form-desc {
    font-size: 0.84rem;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .section {
    padding: 20px 0;
    border-top: 1px solid var(--border);
  }

  .section:first-of-type { border-top: none; padding-top: 0; }

  .section-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }

  .field label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
  }

  .field label .req { color: var(--bad); margin-left: 2px; }

  .field input,
  .field select,
  .field textarea {
    font: inherit;
    font-size: 0.92rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    width: 100%;
  }

  .field textarea {
    resize: vertical;
    min-height: 64px;
    line-height: 1.5;
  }

  .subsection {
    margin-top: 4px;
  }

  .subsection + .subsection { margin-top: 18px; }

  .subsection-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .subsection-title .who {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 9px;
    border-radius: 999px;
  }

  .criterion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-top: 1px dashed var(--border);
  }

  .criterion:first-child { border-top: none; padding-top: 4px; }

  .criterion-info { flex: 1; min-width: 0; }

  .criterion-name {
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.5;
  }

  .score-input {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .score-input input[type="number"] {
    width: 64px;
    text-align: center;
    font: inherit;
    font-weight: 700;
    font-size: 0.98rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
  }

  .score-input input[type="number"]:invalid {
    border-color: var(--bad);
  }

  .score-input .max {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .total-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 6px;
  }

  .total-banner .label { font-size: 0.84rem; color: var(--text-muted); }

  .total-banner .value {
    font-family: "Noto Serif TC", serif;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .total-banner .value.good { color: var(--good); }
  .total-banner .value.warn { color: var(--warn); }
  .total-banner .value.bad { color: var(--bad); }

  .explain-box {
    margin-top: 12px;
    padding: 12px 14px;
    border: 1px solid var(--warn);
    background: var(--warn-soft);
    border-radius: 10px;
  }

  .explain-box .field label { color: var(--warn); font-weight: 700; }

  .submit-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    padding-top: 22px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
  }

  button.primary {
    appearance: none;
    border: none;
    background: var(--accent);
    color: white;
    font: inherit;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 11px 26px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.primary:hover { background: var(--accent-strong); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  button.ghost {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 0.86rem;
    padding: 10px 18px;
    border-radius: 9px;
    cursor: pointer;
  }

  button.ghost:hover { border-color: var(--accent); color: var(--accent); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(12px);
    background: var(--accent-strong);
    color: white;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 500;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- overview view ---------- */

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .toolbar input[type="search"],
  .toolbar select {
    font: inherit;
    font-size: 0.86rem;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  .toolbar input[type="search"] { flex: 1; min-width: 160px; }
  .toolbar .spacer { flex: 1; }

  .emp-name { font-weight: 700; color: var(--text); }
  .emp-meta { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 700;
  }

  .badge.good { background: var(--good-soft); color: var(--good); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.pending { background: var(--surface-2); color: var(--text-muted); }

  .score-cell { font-weight: 700; font-size: 0.98rem; color: var(--text); }
  .score-cell small { font-weight: 500; color: var(--text-muted); }

  .row-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .icon-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font: inherit;
    font-size: 0.76rem;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
  }

  .icon-btn:hover { border-color: var(--bad); color: var(--bad); }
  .icon-btn.export { border-color: var(--accent); color: var(--accent); }
  .icon-btn.export:hover { background: var(--accent-soft); }

  /* ---------- overview: department + person cards ---------- */

  .dept-section + .dept-section { margin-top: 26px; }

  .dept-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .dept-header h2 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent-strong);
  }

  .dept-header .count {
    font-size: 0.76rem;
    color: var(--text-muted);
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }

  .person-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    cursor: pointer;
  }

  .person-card.pending {
    border-style: dashed;
    box-shadow: none;
  }

  .person-card.expanded { grid-column: 1 / -1; cursor: default; }

  .person-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .person-card-score {
    text-align: right;
    flex-shrink: 0;
  }

  .person-card-score .num {
    font-family: "Noto Serif TC", serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent-strong);
  }

  .person-card-score .num small { font-size: 0.78rem; font-weight: 500; color: var(--text-muted); }

  .person-card-meta {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 0.76rem;
    color: var(--text-muted);
  }

  .person-card-foot {
    margin-top: 12px;
    display: flex;
    justify-content: flex-end;
  }

  .person-card-detail {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 18px;
    margin-bottom: 14px;
  }

  .detail-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }

  .detail-item .k {
    font-size: 0.78rem;
    color: var(--text);
    line-height: 1.4;
  }

  .detail-item .tag {
    font-size: 0.64rem;
    color: var(--text-muted);
    display: block;
    margin-top: 2px;
  }

  .detail-item .v {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--accent-strong);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .detail-notes {
    display: grid;
    gap: 10px;
  }

  .detail-notes .note {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .detail-notes .note.flag {
    border-color: var(--warn);
    background: var(--warn-soft);
  }

  .detail-notes .note .k {
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 4px;
  }

  .detail-notes .note.flag .k { color: var(--warn); }

  .detail-notes .note .v {
    font-size: 0.84rem;
    line-height: 1.6;
    white-space: pre-wrap;
    color: var(--text);
  }

  .empty-state {
    text-align: center;
    padding: 56px 20px;
    color: var(--text-muted);
  }

  .empty-state .glyph { font-size: 2rem; margin-bottom: 10px; }

  @media (max-width: 640px) {
    .grid-2 { grid-template-columns: 1fr; }
    #view-form .card { padding: 22px 18px; }
    header.top { flex-direction: column; align-items: flex-start; }
    .detail-grid { grid-template-columns: 1fr; }
    .card-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>2026年Q3季度勤勉考核</h1>
      <div class="sub">填寫考核表</div>
    </div>
  </header>

  <div id="banner-offline" class="banner" hidden>
    ⚠️ 尚未設定 Firebase，資料僅暫存於本機瀏覽器，其他人看不到、也不會同步。請依照 README.md 設定 firebase-config.js。
  </div>

  <!-- ===================== FORM VIEW ===================== -->
  <section id="view-form">
    <div class="card">
      <div class="form-title">員工季度勤勉考核表</div>
      <div class="form-desc">請據實填寫部門評核項目，滿分依部門配分不同。共同管理項目（出勤紀律、組織文化配合度）將由管理課於彙整總覽另行評分。</div>

      <form id="assessment-form">
        <div class="section">
          <div class="section-label">基本資料</div>
          <div class="grid-2">
            <div class="field full">
              <label>填表人姓名<span class="req">*</span></label>
              <input type="text" id="f-reviewerName" placeholder="您的姓名" required>
            </div>
            <div class="field">
              <label>部門<span class="req">*</span></label>
              <select id="f-department" required onchange="onDepartmentChange()">
                <option value="">請選擇部門</option>
              </select>
            </div>
            <div class="field">
              <label>被考核者姓名<span class="req">*</span></label>
              <select id="f-employeeName" required disabled>
                <option value="">請先選擇部門</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section" id="scoring-section" hidden>
          <div class="section-label">部門評核項目</div>
          <div id="criteria-groups"></div>
          <div class="total-banner">
            <span class="label">部門評核小計</span>
            <span class="value" id="live-total">— / 100</span>
          </div>
        </div>

        <div class="section">
          <div class="section-label">質性回饋（選填）</div>
          <div class="grid-2">
            <div class="field full">
              <label>主要優點</label>
              <textarea id="f-strengths" placeholder="這段期間表現突出之處"></textarea>
            </div>
            <div class="field full">
              <label>待改進事項</label>
              <textarea id="f-improvements" placeholder="建議加強或改善的方向"></textarea>
            </div>
          </div>
        </div>

        <div class="submit-row">
          <button type="button" class="ghost" onclick="resetForm()">清除重填</button>
          <button type="submit" class="primary" id="submit-btn">送出考核</button>
        </div>
      </form>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  // ---------- source of truth: department rubrics + rosters (from 考核2026.xlsx) ----------

  const CATEGORIES = {
    "運輸課": {
      criteria: [
        { key: "c1", text: "出車前是否確實核對出貨單、簽單與實物數量/品項，無遺漏", weight: 15, evaluator: "部門直屬主管" },
        { key: "c2", text: "路線規劃與運輸效率-評估運輸作業的準點率(實際出發/到達時間與預定時間之比較)", weight: 15, evaluator: "部門直屬主管" },
        { key: "c3", text: "評估貨物抵達狀態及運送過程中失誤或損壞的比例", weight: 7, evaluator: "部門直屬主管" },
        { key: "c4", text: "作業與駕駛安全 -是否發生安全事故，是否遵守交通規則，及相關安全紀錄", weight: 8, evaluator: "部門直屬主管" },
        { key: "c5", text: "紀錄與回報完整性-落實到貨拍照回報、客戶滿意度、團隊合作與任務完成", weight: 12, evaluator: "部門直屬主管" },

  // ---------- Firebase init (falls back to localStorage if not configured) ----------

  let db = null;
  const FIREBASE_READY = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";

  if (FIREBASE_READY) {
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (err) {
      console.error("Firebase init failed", err);
      db = null;
    }
  }

  const scores = {};

  function $(id) { return document.getElementById(id); }
  window.onDepartmentChange = onDepartmentChange;
  window.setScore = setScore;
  window.resetForm = resetForm;

  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2600);
  }

  function currentCategory() {
    const dept = $("f-department").value;
    return dept ? CATEGORIES[dept] : null;
  }

  function deptCriteria(cat) {
    return cat.criteria.filter(c => c.evaluator === "部門直屬主管");
  }

  // ---------- department / employee dropdowns ----------

  function buildDepartmentOptions() {
    const sel = $("f-department");
    sel.innerHTML = '<option value="">請選擇部門</option>' +
      Object.keys(CATEGORIES).map(d => `<option value="${d}">${d}</option>`).join("");
  }

  function onDepartmentChange() {
    const cat = currentCategory();
    const empSel = $("f-employeeName");
    Object.keys(scores).forEach(k => delete scores[k]);

    if (!cat) {
      empSel.innerHTML = '<option value="">請先選擇部門</option>';
      empSel.disabled = true;
      $("scoring-section").hidden = true;
      return;
    }
    empSel.disabled = false;
    empSel.innerHTML = '<option value="">請選擇被考核者</option>' +
      cat.roster.map(p => `<option value="${p.name}">${p.name}</option>`).join("");
    buildCriteriaGroups(cat);
    $("scoring-section").hidden = false;
    updateTotal();
  }

  // ---------- criteria UI ----------

  function buildCriteriaGroups(cat) {
    const wrap = $("criteria-groups");
    wrap.innerHTML = "";

    const items = deptCriteria(cat);
    if (!items.length) return;
    const rows = items.map(c => `
      <div class="criterion">
        <div class="criterion-info">
          <div class="criterion-name">${escapeHtml(c.text)}</div>
        </div>
        <div class="score-input">
          <input type="number" inputmode="numeric" min="0" max="${c.weight}" step="1"
            data-key="${c.key}" oninput="setScore('${c.key}', this.value, ${c.weight})">
          <span class="max">/ ${c.weight}</span>
        </div>
      </div>`).join("");
    wrap.innerHTML = rows;
  }

  function setScore(key, raw, weight) {
    const n = raw === "" ? null : Math.max(0, Math.min(weight, Math.round(Number(raw))));
    if (n === null) { delete scores[key]; }
    else { scores[key] = n; }
    updateTotal();
  }

  function totalScore(cat) {
    return deptCriteria(cat).reduce((sum, c) => sum + (scores[c.key] ?? 0), 0);
  }

  function filledCount(cat) {
    return deptCriteria(cat).filter(c => scores[c.key] != null).length;
  }

  function updateTotal() {
    const cat = currentCategory();
    const el = $("live-total");
    if (!cat) { el.textContent = "— / 100"; el.className = "value"; return; }

    const items = deptCriteria(cat);
    const max = items.reduce((sum, c) => sum + c.weight, 0);
    const total = totalScore(cat);
    const complete = filledCount(cat) === items.length;
    el.textContent = (complete ? total : "—") + " / " + max;

    let cls = "good";
    if (complete) {
      const ratio = max ? total / max : 0;
      if (ratio < 0.6) cls = "bad";
      else if (ratio < 0.8) cls = "warn";
    }
    el.className = "value " + cls;
  }

  function resetForm() {
    $("assessment-form").reset();
    Object.keys(scores).forEach(k => delete scores[k]);
    $("scoring-section").hidden = true;
    $("f-employeeName").innerHTML = '<option value="">請先選擇部門</option>';
    $("f-employeeName").disabled = true;
  }

  // ---------- submit ----------

  $("assessment-form")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const department = $("f-department").value;
    const cat = currentCategory();
    const employeeName = $("f-employeeName").value;
    const reviewerName = $("f-reviewerName").value.trim();

    if (!reviewerName) { showToast("請填寫填表人姓名"); return; }
    if (!department || !cat) { showToast("請選擇部門"); return; }
    if (!employeeName) { showToast("請選擇被考核者姓名"); return; }
    if (filledCount(cat) < deptCriteria(cat).length) { showToast("請完成所有評分項目"); return; }

    const total = totalScore(cat);

    const btn = $("submit-btn");
    btn.disabled = true;
    btn.textContent = "送出中…";

    const payload = {
      employeeName,
      department,
      reviewerName,
      scores: { ...scores },
      total,
      strengths: $("f-strengths").value.trim(),
      improvements: $("f-improvements").value.trim(),
      submittedAt: new Date().toISOString(),
    };

    try {
      await addRecord(payload);
      showToast("考核已送出，可於「彙整總覽」查看");
      resetForm();
    } catch (err) {
      console.error(err);
      showToast("送出失敗，請稍後再試");
    } finally {
      btn.disabled = false;
      btn.textContent = "送出考核";
    }
  });

  // ---------- data layer: Firestore, with localStorage fallback ----------

  const LOCAL_KEY = "assessment-2026-fallback";

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); }
    catch { return []; }
  }

  function saveLocal(list) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); } catch {}
  }

  async function addRecord(payload) {
    if (db) {
      await addDoc(collection(db, "assessments"), payload);
    } else {
      const list = loadLocal();
      list.push({ id: "local-" + Date.now(), ...payload });
      saveLocal(list);
    }
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
  }

  // ---------- boot ----------

  buildDepartmentOptions();
  $("banner-offline").hidden = FIREBASE_READY;
</script>
